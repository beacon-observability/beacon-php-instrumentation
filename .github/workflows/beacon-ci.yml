name: Beacon PHP Instrumentation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Beacon metadata
        run: python3 beacon/scripts/check-project.py
      - name: Validate zero-code verifier
        run: bash -n examples/slim-zero-code/verify-http.sh
      - name: Check C formatting
        uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: '16'
          check-path: ext

  linux:
    name: Linux / ${{ matrix.arch }} / PHP ${{ matrix.php }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            runner: ubuntu-24.04
            arch: x86_64
          - php: '8.3'
            runner: ubuntu-24.04
            arch: x86_64
          - php: '8.4'
            runner: ubuntu-24.04
            arch: x86_64
          - php: '8.2'
            runner: ubuntu-24.04-arm
            arch: arm64
          - php: '8.3'
            runner: ubuntu-24.04-arm
            arch: arm64
          - php: '8.4'
            runner: ubuntu-24.04-arm
            arch: arm64
    defaults:
      run:
        working-directory: ext
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
      - name: Verify runner architecture
        shell: bash
        run: |
          actual="$(uname -m)"
          case "${{ matrix.arch }}:${actual}" in
            x86_64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo "Unexpected runner architecture: ${actual}" >&2; exit 1 ;;
          esac
      - name: Build
        run: |
          phpize
          ./configure
          make
      - name: Test
        env:
          TEST_PHP_ARGS: '-q'
        run: make test TESTS=--show-diff
      - name: Package candidate binary
        shell: bash
        run: |
          source ../beacon/version.properties
          asset="beacon-php-instrumentation-${BEACON_VERSION}-php${{ matrix.php }}-nts-linux-${{ matrix.arch }}"
          mkdir -p "binaries/${asset}"
          cp modules/opentelemetry.so "binaries/${asset}/opentelemetry.so"
          cp ../beacon/ASSET-README.md "binaries/${asset}/README.md"
          tar -C binaries -czf "binaries/${asset}.tar.gz" "${asset}"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
      - name: Upload candidate binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ext/binaries/${{ env.ASSET }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS / arm64 / PHP ${{ matrix.php }}
    needs: validate
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: ext
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: Build and test
        env:
          TEST_PHP_ARGS: '-q'
        run: |
          phpize
          ./configure
          make
          make test TESTS=--show-diff
      - name: Package candidate binary
        shell: bash
        run: |
          source ../beacon/version.properties
          asset="beacon-php-instrumentation-${BEACON_VERSION}-php${{ matrix.php }}-nts-macos-arm64"
          mkdir -p "binaries/${asset}"
          cp modules/opentelemetry.so "binaries/${asset}/opentelemetry.so"
          cp ../beacon/ASSET-README.md "binaries/${asset}/README.md"
          tar -C binaries -czf "binaries/${asset}.tar.gz" "${asset}"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
      - name: Upload candidate binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ext/binaries/${{ env.ASSET }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows / PHP ${{ matrix.php }} / ${{ matrix.ts }}
    needs: validate
    # PHP 8.4 binaries currently target the VS17/14.44 toolset. windows-2025
    # defaults to VS18/14.51, which produces an extension PHP cannot load.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            ts: nts
          - php: '8.2'
            ts: ts
          - php: '8.3'
            ts: nts
          - php: '8.3'
            ts: ts
          - php: '8.4'
            ts: nts
          - php: '8.4'
            ts: ts
    defaults:
      run:
        working-directory: ext
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The official builder expects config.w32 at its invocation root.
      # Stage this repository's ext/ sources without changing the checkout commit.
      - name: Stage native extension sources
        shell: pwsh
        working-directory: .
        run: Copy-Item -Path ext/* -Destination . -Recurse -Force
      # The former php/setup-php-sdk action is archived. Its replacement
      # handles numbered PHP rebuilds and selects the matching MSVC toolset.
      - name: Build and test extension
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # v1
        env:
          artifact-naming-scheme: pecl
        with:
          php-version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}
          args: --enable-opentelemetry
          run-tests: 'true'
          test-runner-args: '-q --offline --show-diff tests'
          build-directory: ${{ runner.temp }}/beacon-php-build
      - name: Package candidate binary
        shell: pwsh
        run: |
          $properties = Get-Content ../beacon/version.properties | ConvertFrom-StringData
          $compiler = if ('${{ matrix.php }}' -eq '8.4') { 'vs17' } else { 'vs16' }
          $asset = "beacon-php-instrumentation-$($properties.BEACON_VERSION)-php${{ matrix.php }}-${{ matrix.ts }}-$compiler-x86_64"
          New-Item -ItemType Directory -Force "binaries/$asset" | Out-Null
          $packages = @(Get-ChildItem -Path ../artifacts -File -Filter '*.zip')
          if ($packages.Count -ne 1) { throw 'Expected exactly one tested extension package' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'beacon-tested-extension'
          Expand-Archive -LiteralPath $packages[0].FullName -DestinationPath $unpacked
          $dlls = @(Get-ChildItem -Path $unpacked -Recurse -File -Filter php_opentelemetry.dll)
          if ($dlls.Count -ne 1) { throw 'Expected exactly one tested php_opentelemetry.dll' }
          Copy-Item $dlls[0].FullName "binaries/$asset/opentelemetry.dll"
          Copy-Item ../beacon/ASSET-README.md "binaries/$asset/README.md"
          Compress-Archive -Path "binaries/$asset/*" -DestinationPath "binaries/$asset.zip" -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload candidate binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ext/binaries/${{ env.ASSET }}.zip
          if-no-files-found: error

  source-package:
    name: Source package
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: php:8.5-cli@sha256:e2b5f2495f2a268082fbb88d8045511bd770390e062b21c35110be78e082d1a3
    defaults:
      run:
        working-directory: ext
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build PECL-compatible source package
        shell: bash
        run: |
          source ../beacon/version.properties
          pear package-validate
          pear package
          asset="beacon-php-instrumentation-${BEACON_VERSION}-source"
          mkdir -p binaries
          mv opentelemetry-*.tgz "binaries/${asset}.tgz"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
      - name: Upload candidate source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ext/binaries/${{ env.ASSET }}.tgz
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, source-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Enforce release version
        shell: bash
        run: |
          source beacon/version.properties
          if [[ "${BEACON_VERSION}" == *-dev ]]; then
            echo 'Development versions cannot be released' >&2
            exit 1
          fi
          test "${GITHUB_REF_NAME}" = "v${BEACON_VERSION}"
          echo "RELEASE_NAME=v${BEACON_VERSION}" >> "$GITHUB_ENV"
      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: beacon-php-instrumentation-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: cd release-assets && sha256sum * > SHA256SUMS
      - name: Create draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: true
          generate_release_notes: true
          name: ${{ env.RELEASE_NAME }}
          files: release-assets/*
