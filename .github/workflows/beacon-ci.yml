name: Beacon PHP Instrumentation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Beacon metadata
        run: python3 beacon/scripts/check-project.py
      - name: Validate zero-code verifier
        run: bash -n examples/slim-zero-code/verify-http.sh
      - name: Check C formatting
        uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: '16'
          check-path: ext

  linux:
    name: Linux / PHP ${{ matrix.php }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    defaults:
      run:
        working-directory: ext
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php }}
      - name: Build
        run: |
          phpize
          ./configure
          make
      - name: Test
        env:
          TEST_PHP_ARGS: '-q'
        run: make test TESTS=--show-diff
      - name: Package candidate binary
        shell: bash
        run: |
          source ../beacon/version.properties
          asset="beacon-php-instrumentation-${BEACON_VERSION}-php${{ matrix.php }}-nts-linux-x86_64"
          mkdir -p "binaries/${asset}"
          cp modules/opentelemetry.so "binaries/${asset}/opentelemetry.so"
          cp ../beacon/ASSET-README.md "binaries/${asset}/README.md"
          tar -C binaries -czf "binaries/${asset}.tar.gz" "${asset}"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
      - name: Upload candidate binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ext/binaries/${{ env.ASSET }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS / PHP 8.4
    needs: validate
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ext
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.4'
      - name: Build and test
        env:
          TEST_PHP_ARGS: '-q'
        run: |
          phpize
          ./configure
          make
          make test TESTS=--show-diff

  windows:
    name: Windows / PHP ${{ matrix.php }} / ${{ matrix.ts }}
    needs: validate
    # PHP 8.4 binaries currently target the VS17/14.44 toolset. windows-2025
    # defaults to VS18/14.51, which produces an extension PHP cannot load.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            ts: nts
          - php: '8.4'
            ts: nts
          - php: '8.4'
            ts: ts
    defaults:
      run:
        working-directory: ext
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install PHP SDK
        id: setup-php-sdk
        uses: php/setup-php-sdk@e2ce1c294f272ed93e8083f14649f5adadf93788 # v0.12
        with:
          version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}
      - name: Install compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: ${{ steps.setup-php-sdk.outputs.toolset }}
      - name: Build
        env:
          PHP_SDK_PREFIX: ${{ steps.setup-php-sdk.outputs.prefix }}
        run: |
          phpize
          ./configure --enable-opentelemetry --with-prefix=$env:PHP_SDK_PREFIX
          nmake
      - name: Test
        env:
          TEST_PHP_ARGS: '-q'
        run: nmake test TESTS=--show-diff
      - name: Package candidate binary
        shell: pwsh
        run: |
          $properties = Get-Content ../beacon/version.properties | ConvertFrom-StringData
          $compiler = "vs$($env:VisualStudioVersion.Split('.')[0])"
          $asset = "beacon-php-instrumentation-$($properties.BEACON_VERSION)-php${{ matrix.php }}-${{ matrix.ts }}-$compiler-x86_64"
          New-Item -ItemType Directory -Force "binaries/$asset" | Out-Null
          $dll = Get-ChildItem -Path x64 -Recurse -Filter php_opentelemetry.dll | Select-Object -First 1
          if (-not $dll) { throw 'php_opentelemetry.dll was not produced' }
          Copy-Item $dll.FullName "binaries/$asset/opentelemetry.dll"
          Copy-Item ../beacon/ASSET-README.md "binaries/$asset/README.md"
          Compress-Archive -Path "binaries/$asset/*" -DestinationPath "binaries/$asset.zip" -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload candidate binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ext/binaries/${{ env.ASSET }}.zip
          if-no-files-found: error

  source-package:
    name: Source package
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: php:8.5-cli@sha256:e2b5f2495f2a268082fbb88d8045511bd770390e062b21c35110be78e082d1a3
    defaults:
      run:
        working-directory: ext
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build PECL-compatible source package
        shell: bash
        run: |
          source ../beacon/version.properties
          pear package-validate
          pear package
          asset="beacon-php-instrumentation-${BEACON_VERSION}-source"
          mkdir -p binaries
          mv opentelemetry-*.tgz "binaries/${asset}.tgz"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
      - name: Upload candidate source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ext/binaries/${{ env.ASSET }}.tgz
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, source-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Enforce release version
        shell: bash
        run: |
          source beacon/version.properties
          if [[ "${BEACON_VERSION}" == *-dev ]]; then
            echo 'Development versions cannot be released' >&2
            exit 1
          fi
          test "${GITHUB_REF_NAME}" = "v${BEACON_VERSION}"
      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: cd release-assets && sha256sum * > SHA256SUMS
      - name: Create draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
